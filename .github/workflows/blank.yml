name: Windows Cloud PC

on:
  workflow_dispatch:

jobs:
  windows:
    name: Iniciar Windows
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Verificar sistema
        shell: powershell
        run: |
          Write-Host "Windows iniciado"
          Write-Host "Processadores: $env:NUMBER_OF_PROCESSORS"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion

      - name: Teste
        shell: powershell
        run: |
          Write-Host "Workflow funcionando corretamente!"
- name: Iniciar AnyDesk
      - name: Iniciar AnyDesk
        shell: powershell
        run: |
          if (Test-Path "start.bat") {
            cmd /c start.bat
            Start-Sleep -Seconds 10
          }
          else {
            Write-Host "ERRO: Arquivo start.bat não encontrado"
            exit 1
          }

      - name: Monitoramento
        shell: powershell
        run: |
          while ($true) {
            $anydesk = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue

            if (-not $anydesk) {
              Write-Host "AnyDesk não está executando."
              
              if (Test-Path "start.bat") {
                cmd /c start.bat
              }
            }

            Start-Sleep -Seconds 60
          }

      - name: Limpeza Segura
        if: always()
        shell: powershell
        run: |
          Remove-Item "Downloads.bat" -Force -ErrorAction SilentlyContinue
          Write-Host "Limpeza finalizada."
