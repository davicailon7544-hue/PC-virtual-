name: Windows Cloud PC - AnyDesk

on:
  workflow_dispatch:

jobs:
  construir:
    name: Iniciando Sistema
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      OPENGL: "1"
      GITHUB_PRESERVE_WORKFLOW: "true"
      MEMORIA_GB: "16"

    steps:
      - name: Baixar e Instalar Essenciais
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "URL_DO_ARQUIVO" -OutFile "$env:TEMP\arquivo.bat"
          cmd /c "$env:TEMP\arquivo.bat"

      - name: Iniciar AnyDesk
        shell: powershell
        run: |
          Write-Host "Iniciando AnyDesk..."
          # coloque aqui apenas comandos necessários para a instalação/configuração
- name: Iniciar AnyDesk
      - name: Iniciar AnyDesk
        shell: powershell
        run: |
          if (Test-Path "start.bat") {
            cmd /c start.bat
            Start-Sleep -Seconds 10
          }
          else {
            Write-Host "ERRO: Arquivo start.bat não encontrado"
            exit 1
          }

      - name: Monitoramento
        shell: powershell
        run: |
          while ($true) {
            $anydesk = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue

            if (-not $anydesk) {
              Write-Host "AnyDesk não está executando."
              
              if (Test-Path "start.bat") {
                cmd /c start.bat
              }
            }

            Start-Sleep -Seconds 60
          }

      - name: Limpeza Segura
        if: always()
        shell: powershell
        run: |
          Remove-Item "Downloads.bat" -Force -ErrorAction SilentlyContinue
          Write-Host "Limpeza finalizada."
